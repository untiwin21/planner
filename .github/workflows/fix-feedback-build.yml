name: Fix and verify planner feedback build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-feedback-build.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_feedback_build.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "Planr Build Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/aiExport.ts src/hooks/usePlanrStore.ts
          git commit -m "fix: finalize planner feedback export consistency"
          git push
