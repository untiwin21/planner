name: Repair About Me prop wiring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-about-me-props.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair page props
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          s = s.replace('              onAddRoutine={store.addRoutine}\n      onUpdateRoutine={store.updateRoutine}\n              onSetStatus={store.setRoutineStatus}\n              onUpdateRoutine={store.updateRoutine}\n', '              onAddRoutine={store.addRoutine}\n              onSetStatus={store.setRoutineStatus}\n              onUpdateRoutine={store.updateRoutine}\n', 1)
          s = s.replace('      onUpdateWeeklyReview={store.updateWeeklyReview}\n      onAddRoutine={store.addRoutine}\n      onAddLongGoal={store.addLongGoal}\n', '      onUpdateWeeklyReview={store.updateWeeklyReview}\n      onAddRoutine={store.addRoutine}\n      onUpdateRoutine={store.updateRoutine}\n      onAddLongGoal={store.addLongGoal}\n', 1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-about-me-props.yml
          git config user.name 'Planr About Me Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: wire About Me routine editing correctly'
          git push