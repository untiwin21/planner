name: Fix focus save flow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-focus-save-flow.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_focus_save_flow.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified focus save fix
        run: |
          git config user.name "Planr Focus Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/today/TaskExecutionLayer.tsx src/hooks/usePlanrStore.ts
          git commit -m "fix: make focus saves resilient to sync failures"
          git push
