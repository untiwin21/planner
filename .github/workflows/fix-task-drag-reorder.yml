name: Fix task drag reorder
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-drag-reorder.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_task_drag_reorder.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified drag fix
        run: |
          git config user.name "Planr Drag Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/today/TodayDashboard.tsx
          git commit -m "fix: make task card reordering reliable"
          git push
