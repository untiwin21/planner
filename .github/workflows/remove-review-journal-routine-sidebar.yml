name: Remove review journal routine sidebar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-review-journal-routine-sidebar.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove routine sidebar from review and journal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = """            {view !== 'today' && view !== 'week' && view !== 'direction' && <RoutineSidebar
              routines={store.routines}
              logs={store.logs}
              selectedDate={selectedDate}
              onToggleLog={store.toggleRoutineLog}
              onAddRoutine={store.addRoutine}
              onSetStatus={store.setRoutineStatus}
              onUpdateRoutine={store.updateRoutine}
              onDeleteRoutine={store.deleteRoutine}
            />}
"""
          if old not in s:
              raise SystemExit('routine sidebar block not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit change
        run: |
          git config user.name "Planr Sidebar Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix: remove routine sidebar from review and journal"
          git push
