name: Remove review journal routine sidebar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-review-journal-routine-sidebar.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove routine sidebar block
        run: sed -i "/{view !== 'today' && view !== 'week' && view !== 'direction' && <RoutineSidebar/,/            \/>}/d" src/app/page.tsx
      - name: Commit change
        run: |
          git config user.name "Planr Sidebar Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove routine sidebar from review and journal"
          git push
