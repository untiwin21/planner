name: Apply direction dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-direction-dashboard.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()

          s = s.replace(
            "import { ShortGoalEditModal } from '@/components/weekly/ShortGoalEditModal'",
            "import { ShortGoalEditModal } from '@/components/weekly/ShortGoalEditModal'\nimport { DirectionDashboard } from '@/components/direction/DirectionDashboard'",
          )
          s = s.replace(
            "const [view, setView] = useState<'today' | 'week' | 'review' | 'journal'>('today')",
            "const [view, setView] = useState<'today' | 'week' | 'review' | 'journal' | 'direction'>('today')",
          )

          journal_button = '''              <button onClick={() => setView('journal')}
                className={clsx('px-3 h-7 rounded-[8px] text-sm font-medium transition-all',
                  view === 'journal' ? 'bg-white text-[var(--text)] shadow-sm' : 'text-[var(--text-3)] hover:text-[var(--text-2)]')}>
                기록
              </button>'''
          direction_button = journal_button + '''
              <button onClick={() => setView('direction')}
                className={clsx('px-3 h-7 rounded-[8px] text-sm font-medium transition-all',
                  view === 'direction' ? 'bg-white text-[var(--text)] shadow-sm' : 'text-[var(--text-3)] hover:text-[var(--text-2)]')}>
                나의 방향
              </button>'''
          if journal_button in s and "setView('direction')" not in s:
              s = s.replace(journal_button, direction_button, 1)

          s = s.replace("{view !== 'today' && (", "{view !== 'today' && view !== 'direction' && (", 1)
          s = s.replace(
            "<div className=\"grid gap-5\" style={{ gridTemplateColumns: '280px 1fr' }}>",
            "<div className=\"grid gap-5\" style={{ gridTemplateColumns: view === 'direction' ? '1fr' : '280px 1fr' }}>",
            1,
          )
          left_marker = '''          {/* Left sidebar */}
          <div className="flex flex-col gap-4 min-w-0">'''
          s = s.replace(
            left_marker,
            '''          {/* Left sidebar */}
          <div className={clsx('flex flex-col gap-4 min-w-0', view === 'direction' && 'hidden')}>''',
            1,
          )
          s = s.replace(
            "{view !== 'today' && view !== 'week' && <RoutineSidebar",
            "{view !== 'today' && view !== 'week' && view !== 'direction' && <RoutineSidebar",
            1,
          )

          journal_branch = ") : view === 'journal' ? ("
          direction_branch = ''') : view === 'direction' ? (
              <DirectionDashboard
                routines={store.routines}
                logs={store.logs}
                longGoals={store.longGoals}
                getLongGoalProgress={store.getLongGoalProgress}
                getWeeklyReview={store.getWeeklyReview}
                onUpdateWeeklyReview={store.updateWeeklyReview}
                onAddRoutine={store.addRoutine}
                onAddLongGoal={store.addLongGoal}
                onUpdateLongGoal={store.updateLongGoal}
                onDeleteLongGoal={store.deleteLongGoal}
              />
            ) : view === 'journal' ? ('''
          if journal_branch in s and '<DirectionDashboard' not in s:
              s = s.replace(journal_branch, direction_branch, 1)

          # Do not show week navigation controls on the direction page.
          old_nav = '''            {view === 'today' ? (
              selectedDate !== formatDate(new Date()) && (
                <button onClick={() => setSelectedDate(formatDate(new Date()))}
                  className="px-3 h-8 rounded-[8px] text-sm font-medium hover:bg-white border border-transparent hover:border-[var(--border)] transition-all text-[var(--text-2)]">
                  오늘로
                </button>
              )
            ) : (
              <>'''
          new_nav = '''            {view === 'today' ? (
              selectedDate !== formatDate(new Date()) && (
                <button onClick={() => setSelectedDate(formatDate(new Date()))}
                  className="px-3 h-8 rounded-[8px] text-sm font-medium hover:bg-white border border-transparent hover:border-[var(--border)] transition-all text-[var(--text-2)]">
                  오늘로
                </button>
              )
            ) : view === 'direction' ? null : (
              <>'''
          s = s.replace(old_nav, new_nav, 1)

          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-direction-dashboard.yml
          git config user.name 'Planr Direction Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate identity and goal direction view'
          git push
