name: Enforce direction navigation patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-direction-navigation-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch line by line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          lines = p.read_text().splitlines()

          # 1) Add visible navigation button after the Journal button.
          if not any('나의 방향' in line for line in lines):
              journal = next(i for i, line in enumerate(lines) if "setView('journal')" in line)
              close = next(i for i in range(journal, journal + 8) if '</button>' in lines[i])
              button = [
                  "              <button onClick={() => setView('direction')}",
                  "                className={clsx('px-3 h-7 rounded-[8px] text-sm font-medium transition-all',",
                  "                  view === 'direction' ? 'bg-white text-[var(--text)] shadow-sm' : 'text-[var(--text-3)] hover:text-[var(--text-2)]')}>",
                  "                나의 방향",
                  "              </button>",
              ]
              lines[close + 1:close + 1] = button

          # 2) Direction is not week-based, so hide week navigation controls.
          today_nav = next(i for i, line in enumerate(lines) if i > 250 and "{view === 'today' ? (" in line)
          week_else = next(i for i in range(today_nav, today_nav + 20) if lines[i].strip() == ') : (')
          lines[week_else] = lines[week_else].replace(') : (', ") : view === 'direction' ? null : (")

          # 3) Direction uses the full width; hide the ordinary left sidebar.
          left_comment = next(i for i, line in enumerate(lines) if '{/* Left sidebar */}' in line)
          left_div = next(i for i in range(left_comment + 1, left_comment + 4) if 'className="flex flex-col gap-4 min-w-0"' in lines[i])
          lines[left_div] = lines[left_div].replace(
              'className="flex flex-col gap-4 min-w-0"',
              "className={clsx('flex flex-col gap-4 min-w-0', view === 'direction' && 'hidden')}",
          )

          text = '\n'.join(lines) + '\n'
          assert '나의 방향' in text
          assert ") : view === 'direction' ? null : (" in text
          assert "view === 'direction' && 'hidden'" in text
          p.write_text(text)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-direction-navigation-v2.yml
          git config user.name 'Planr Direction Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose direction dashboard in navigation'
          git push
