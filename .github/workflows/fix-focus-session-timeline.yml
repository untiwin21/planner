name: Fix focus session timeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-focus-session-timeline.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch focus sessions and actual timeline
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Promote stopwatch session data to the shared Task model.
          p = Path('src/types.ts')
          s = p.read_text()
          needle = "export interface Task {\n"
          insert = """export interface FocusSessionRecord {
  id: string
  started_at: string
  ended_at: string
  duration_min: number
  source: 'stopwatch' | 'manual'
}

export interface Task {
"""
          if 'export interface FocusSessionRecord' not in s:
              if needle not in s:
                  raise SystemExit('Task interface marker not found')
              s = s.replace(needle, insert, 1)
          task_marker = "  actual_status?: 'recorded' | 'skipped'\n  /** Retrospective-only item: shown on the actual timeline, never as a planned task. */"
          task_fields = """  actual_status?: 'recorded' | 'skipped'
  /** Total focused/recorded work time. This may be the sum of multiple sessions. */
  actual_duration_min?: number
  /** Individual execution windows. Timeline rendering must prefer these over aggregate start/end. */
  actual_sessions?: FocusSessionRecord[]
  /** Retrospective-only item: shown on the actual timeline, never as a planned task. */"""
          if task_marker in s:
              s = s.replace(task_marker, task_fields, 1)
          p.write_text(s)

          # 2) Record each active segment separately in Focus Mode.
          p = Path('src/components/today/TaskExecutionLayer.tsx')
          s = p.read_text()
          s = s.replace("import type { DayEntry, SubTask, Task } from '@/types'", "import type { DayEntry, FocusSessionRecord, SubTask, Task } from '@/types'")
          local_iface = """interface FocusSessionRecord {
  id: string
  started_at: string
  ended_at: string
  duration_min: number
  source: 'stopwatch'
}

"""
          s = s.replace(local_iface, '')
          active_marker = "  accumulatedMs: number\n  running: boolean"
          if active_marker in s:
              s = s.replace(active_marker, "  accumulatedMs: number\n  segments: Array<{ startedAt: number; endedAt: number }>\n  running: boolean", 1)
          s = s.replace("    return parsed as ActiveFocusSession", "    return { ...parsed, segments: Array.isArray(parsed.segments) ? parsed.segments : [] } as ActiveFocusSession")

          pause_old = """      const next = {
        ...current,
        accumulatedMs: current.accumulatedMs + Math.max(0, pausedAt - current.segmentStartedAt),
        segmentStartedAt: null,
        running: false,
      }"""
          pause_new = """      const next = {
        ...current,
        accumulatedMs: current.accumulatedMs + Math.max(0, pausedAt - current.segmentStartedAt),
        segments: [
          ...(current.segments ?? []),
          ...(pausedAt > current.segmentStartedAt ? [{ startedAt: current.segmentStartedAt, endedAt: pausedAt }] : []),
        ],
        segmentStartedAt: null,
        running: false,
      }"""
          if pause_old not in s:
              raise SystemExit('pauseSession block not found')
          s = s.replace(pause_old, pause_new, 1)

          start_old = """      segmentStartedAt: startedAt,
      accumulatedMs: 0,
      running: true,"""
          start_new = """      segmentStartedAt: startedAt,
      accumulatedMs: 0,
      segments: [],
      running: true,"""
          if start_old not in s:
              raise SystemExit('startSession block not found')
          s = s.replace(start_old, start_new, 1)

          finish_start_old = """      const finishedAt = Date.now()
      const activeMinutes = elapsedMs(session, finishedAt) / 60_000
      const days = readDays()"""
          finish_start_new = """      const finishedAt = Date.now()
      const finishedSegments = [
        ...(session.segments ?? []),
        ...(session.running && session.segmentStartedAt && finishedAt > session.segmentStartedAt
          ? [{ startedAt: session.segmentStartedAt, endedAt: finishedAt }]
          : []),
      ]
      const activeMinutes = finishedSegments.reduce((sum, segment) => sum + Math.max(0, segment.endedAt - segment.startedAt), 0) / 60_000
      const days = readDays()"""
          if finish_start_old not in s:
              raise SystemExit('finishSession start block not found')
          s = s.replace(finish_start_old, finish_start_new, 1)

          finish_records_old = """      const previousMinutes = taskActualMinutes(task) ?? 0
      const totalMinutes = previousMinutes + activeMinutes
      const firstClock = task.actual_status === 'recorded' && task.actual_start_time
        ? task.actual_start_time
        : wallClock(session.firstStartedAt)
      const sessions: FocusSessionRecord[] = [
        ...(task.actual_sessions ?? []),
        {
          id: uid(),
          started_at: new Date(session.firstStartedAt).toISOString(),
          ended_at: new Date(finishedAt).toISOString(),
          duration_min: activeMinutes,
          source: 'stopwatch',
        },
      ]
      const updatedTask: FocusTask = {
        ...task,
        actual_start_time: firstClock,
        actual_end_time: addMinutesToClock(firstClock, totalMinutes),
        actual_status: 'recorded',
        actual_duration_min: totalMinutes,
        actual_sessions: sessions,
        updated_at: Date.now(),
      }"""
          finish_records_new = """      const previousMinutes = taskActualMinutes(task) ?? 0
      const totalMinutes = previousMinutes + activeMinutes
      const newSessions: FocusSessionRecord[] = finishedSegments.map(segment => ({
        id: uid(),
        started_at: new Date(segment.startedAt).toISOString(),
        ended_at: new Date(segment.endedAt).toISOString(),
        duration_min: Math.max(0, segment.endedAt - segment.startedAt) / 60_000,
        source: 'stopwatch',
      }))
      const sessions: FocusSessionRecord[] = [...(task.actual_sessions ?? []), ...newSessions]
      const firstSession = sessions[0]
      const lastSession = sessions[sessions.length - 1]
      const updatedTask: FocusTask = {
        ...task,
        actual_start_time: firstSession ? wallClock(new Date(firstSession.started_at).getTime()) : wallClock(session.firstStartedAt),
        actual_end_time: lastSession ? wallClock(new Date(lastSession.ended_at).getTime()) : wallClock(finishedAt),
        actual_status: 'recorded',
        actual_duration_min: totalMinutes,
        actual_sessions: sessions,
        updated_at: Date.now(),
      }"""
          if finish_records_old not in s:
              raise SystemExit('finishSession record block not found')
          s = s.replace(finish_records_old, finish_records_new, 1)

          add_minutes_func = """function addMinutesToClock(clock: string, minutes: number) {
  const start = timeToMinutes(clock)
  if (start === null) return clock
  const total = ((start + Math.max(1, Math.round(minutes))) % (24 * 60) + 24 * 60) % (24 * 60)
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`
}

"""
          s = s.replace(add_minutes_func, '')
          p.write_text(s)

          # 3) Render stopwatch sessions as independent blocks on the actual timeline.
          p = Path('src/components/today/TodayDashboard.tsx')
          s = p.read_text()
          s = s.replace(
              "import type { BadgeColor, Category, DayEntry, DayMeta, LongGoal, Routine, RoutineConfig, RoutineLog, RoutineLogPatch, RoutinePeriod, RoutineStatus, ShortGoal, SubTask, Task, TaskScheduleInput } from '@/types'",
              "import type { BadgeColor, Category, DayEntry, DayMeta, FocusSessionRecord, LongGoal, Routine, RoutineConfig, RoutineLog, RoutineLogPatch, RoutinePeriod, RoutineStatus, ShortGoal, SubTask, Task, TaskScheduleInput } from '@/types'",
          )
          actual_iface_old = """interface ActualTimelineItem {
  key: string
  token: string
  task: Task
  subtask?: SubTask
  text: string
  categoryName: string
  categoryColor: BadgeColor
  start: number
  end: number
}"""
          actual_iface_new = """interface ActualTimelineItem {
  key: string
  token: string
  task: Task
  subtask?: SubTask
  session?: FocusSessionRecord
  text: string
  categoryName: string
  categoryColor: BadgeColor
  start: number
  end: number
}"""
          if actual_iface_old not in s:
              raise SystemExit('ActualTimelineItem interface not found')
          s = s.replace(actual_iface_old, actual_iface_new, 1)

          actual_blocks_start = s.index("  const actualBlocks = useMemo<ActualTimelineItem[]>(() => {")
          actual_blocks_end = s.index("\n\n  const flexible = useMemo", actual_blocks_start)
          actual_blocks_new = """  const actualBlocks = useMemo<ActualTimelineItem[]>(() => {
    const items: ActualTimelineItem[] = []
    const pushRange = ({ task, subtask, session, rawStart, rawEnd }: {
      task: Task
      subtask?: SubTask
      session?: FocusSessionRecord
      rawStart: number
      rawEnd: number
    }) => {
      const start = rawStart < TIMELINE_START ? rawStart + 24 * 60 : rawStart
      let end = rawEnd < TIMELINE_START ? rawEnd + 24 * 60 : rawEnd
      if (end <= start) end += 24 * 60
      const normalizedStart = Math.max(TIMELINE_START, start)
      const normalizedEnd = Math.min(TIMELINE_END, end)
      if (normalizedEnd <= normalizedStart) return
      items.push({
        key: session
          ? `actual-session:${task.id}:${session.id}`
          : subtask
            ? `actual-subtask:${task.id}:${subtask.id}`
            : `actual-task:${task.id}`,
        token: session
          ? `actual-session:${task.id}:${session.id}`
          : subtask
            ? actualSubtaskDragToken(task.id, subtask.id)
            : actualTaskDragToken(task.id),
        task,
        subtask,
        session,
        text: subtask?.text ?? task.text,
        categoryName: session ? '집중 세션' : subtask ? `${task.text} · 하위` : task.category_name,
        categoryColor: task.category_color,
        start: normalizedStart,
        end: normalizedEnd,
      })
    }
    const appendLegacy = ({ task, subtask }: { task: Task; subtask?: SubTask }) => {
      const actualStatus = subtask?.actual_status ?? task.actual_status
      const actualStart = subtask?.actual_start_time ?? (!subtask ? task.actual_start_time : undefined)
      const actualEnd = subtask?.actual_end_time ?? (!subtask ? task.actual_end_time : undefined)
      if (actualStatus !== 'recorded' || !actualStart || !actualEnd) return
      const rawStart = timeToMinutes(actualStart)
      const rawEnd = timeToMinutes(actualEnd)
      if (rawStart === null || rawEnd === null) return
      pushRange({ task, subtask, rawStart, rawEnd })
    }
    const appendSession = (task: Task, session: FocusSessionRecord) => {
      const startedAt = new Date(session.started_at)
      if (Number.isNaN(startedAt.getTime()) || !Number.isFinite(session.duration_min) || session.duration_min <= 0) return
      const rawStart = startedAt.getHours() * 60 + startedAt.getMinutes() + startedAt.getSeconds() / 60
      // duration_min is authoritative. Older stopwatch records may span pauses in ended_at.
      pushRange({ task, session, rawStart, rawEnd: rawStart + session.duration_min })
    }
    for (const task of entry.tasks) {
      if ((task.actual_sessions ?? []).length > 0) {
        for (const session of task.actual_sessions ?? []) appendSession(task, session)
      } else {
        appendLegacy({ task })
      }
      for (const subtask of task.subtasks ?? []) appendLegacy({ task, subtask })
    }
    return items.sort((a, b) => a.start - b.start)
  }, [entry.tasks])"""
          s = s[:actual_blocks_start] + actual_blocks_new + s[actual_blocks_end:]

          # Manual actual-time operations replace stopwatch session history for that task.
          replacements = [
            ("""        onUpdateTask(actualEditor.taskId, {
          actual_start_time: actualEditor.start,
          actual_end_time: actualEditor.end,
          actual_status: 'recorded',
          done: true,
        })""",
             """        onUpdateTask(actualEditor.taskId, {
          actual_start_time: actualEditor.start,
          actual_end_time: actualEditor.end,
          actual_status: 'recorded',
          actual_duration_min: undefined,
          actual_sessions: undefined,
          done: true,
        })"""),
            ("""    onUpdateTask(actualEditor.taskId, {
      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: 'skipped',
      done: false,
    })""",
             """    onUpdateTask(actualEditor.taskId, {
      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: 'skipped',
      actual_duration_min: undefined,
      actual_sessions: undefined,
      done: false,
    })"""),
            ("""    onUpdateTask(actualEditor.taskId, {
      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: undefined,
    })""",
             """    onUpdateTask(actualEditor.taskId, {
      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: undefined,
      actual_duration_min: undefined,
      actual_sessions: undefined,
    })"""),
            ("""      onUpdateTask(taskId, {
        actual_start_time: minutesToTime(range.start),
        actual_end_time: minutesToTime(range.end),
        actual_status: 'recorded',
        done: true,
      })""",
             """      onUpdateTask(taskId, {
        actual_start_time: minutesToTime(range.start),
        actual_end_time: minutesToTime(range.end),
        actual_status: 'recorded',
        actual_duration_min: undefined,
        actual_sessions: undefined,
        done: true,
      })"""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected manual actual-time block not found')
              s = s.replace(old, new, 1)

          discard_old = """      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: undefined,
    } : { discarded: false })"""
          discard_new = """      actual_start_time: undefined,
      actual_end_time: undefined,
      actual_status: undefined,
      actual_duration_min: undefined,
      actual_sessions: undefined,
    } : { discarded: false })"""
          if discard_old not in s:
              raise SystemExit('discardTask actual clear block not found')
          s = s.replace(discard_old, discard_new, 1)

          toggle_marker = """  function toggleTaskWithActualEditor(task: Task) {
    onToggleTask(task.id)
    if (task.done || task.discarded || !canEditActual) return"""
          toggle_new = """  function toggleTaskWithActualEditor(task: Task) {
    onToggleTask(task.id)
    if (task.done || task.discarded || !canEditActual || (task.actual_sessions?.length ?? 0) > 0) return"""
          if toggle_marker not in s:
              raise SystemExit('toggleTaskWithActualEditor marker not found')
          s = s.replace(toggle_marker, toggle_new, 1)

          render_old = """              {actualBlocks.map(item => {
                const { task, subtask, token, text, categoryName, categoryColor, start, end } = item
                const top = timelinePosition(start)
                const height = timelineBlockHeight(start, end)
                const overlapsRoutine = routineActualGroups.some(group => group.start < end && group.end > start)
                return (
                  <button
                    type=\"button\"
                    key={item.key}
                    draggable
                    onDragStart={event => {
                      setDraggedTaskId(token)
                      event.dataTransfer.setData('text/plain', token)
                      event.dataTransfer.effectAllowed = 'move'
                    }}
                    onDragEnd={() => { setDraggedTaskId(null); setDragPreviewMinute(null) }}
                    onClick={() => openActualEditor(task, start, end, subtask)}
                    className={clsx('absolute right-0.5 z-20 rounded-[9px] border px-2 py-1.5 overflow-hidden text-left shadow-sm hover:ring-2 hover:ring-black/10 active:cursor-grabbing', TIMELINE_CATEGORY_STYLE[categoryColor])}
                    style={{ top, height, left: 'calc(50% + 2px)', right: overlapsRoutine ? '25%' : 2 }}
                    title=\"실제 시간 수정\"
                  >
                    <div className=\"flex items-center gap-1.5\">
                      <span className=\"text-xs font-semibold flex-1 min-w-0 truncate\">{text}</span>
                      <span className=\"text-[9px] opacity-65 shrink-0\">{subtask ? '하위' : categoryName}</span>
                    </div>
                    {end - start >= 45 && <p className=\"text-[10px] opacity-70 mt-0.5\">{minutesToTime(start)}–{minutesToTime(end)} · {formatDuration(end - start)}</p>}
                  </button>
                )
              })}"""
          render_new = """              {actualBlocks.map(item => {
                const { task, subtask, session, token, text, categoryName, categoryColor, start, end } = item
                const top = timelinePosition(start)
                const height = timelineBlockHeight(start, end)
                const overlapsRoutine = routineActualGroups.some(group => group.start < end && group.end > start)
                return (
                  <button
                    type=\"button\"
                    key={item.key}
                    draggable={!session}
                    onDragStart={event => {
                      if (session) return
                      setDraggedTaskId(token)
                      event.dataTransfer.setData('text/plain', token)
                      event.dataTransfer.effectAllowed = 'move'
                    }}
                    onDragEnd={() => { setDraggedTaskId(null); setDragPreviewMinute(null) }}
                    onClick={() => { if (!session) openActualEditor(task, start, end, subtask) }}
                    className={clsx('absolute right-0.5 z-20 rounded-[9px] border px-2 py-1.5 overflow-hidden text-left shadow-sm', !session && 'hover:ring-2 hover:ring-black/10 active:cursor-grabbing', TIMELINE_CATEGORY_STYLE[categoryColor])}
                    style={{ top, height, left: 'calc(50% + 2px)', right: overlapsRoutine ? '25%' : 2 }}
                    title={session ? `스톱워치 집중 세션 · ${minutesToTime(start)}–${minutesToTime(end)}` : '실제 시간 수정'}
                  >
                    <div className=\"flex items-center gap-1.5\">
                      <span className=\"text-xs font-semibold flex-1 min-w-0 truncate\">{text}</span>
                      <span className=\"text-[9px] opacity-65 shrink-0\">{session ? '집중' : subtask ? '하위' : categoryName}</span>
                    </div>
                    {end - start >= 20 && <p className=\"text-[10px] opacity-70 mt-0.5\">{minutesToTime(start)}–{minutesToTime(end)} · {formatDuration(end - start)}</p>}
                  </button>
                )
              })}"""
          if render_old not in s:
              raise SystemExit('actualBlocks render block not found')
          s = s.replace(render_old, render_new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/fix-focus-session-timeline.yml
          git config user.name 'Planr Focus Session Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render focus stopwatch sessions separately'
          git push