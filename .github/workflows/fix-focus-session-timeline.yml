name: Fix focus session timeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-focus-session-timeline.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_focus_sessions.py
      - name: Commit patch
        run: |
          rm scripts/fix_focus_sessions.py
          rm .github/workflows/fix-focus-session-timeline.yml
          git config user.name 'Planr Focus Session Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render focus stopwatch sessions separately'
          git push
