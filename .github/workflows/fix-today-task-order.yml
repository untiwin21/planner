name: Fix persistent Today task ordering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-today-task-order.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_today_task_order.py
      - run: npm ci
      - run: npm run build
      - name: Commit verified ordering fix
        run: |
          git config user.name "Planr Ordering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/today/TodayDashboard.tsx
          git commit -m "fix: preserve user task order within categories"
          git push
