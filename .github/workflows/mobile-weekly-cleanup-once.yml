name: one-time mobile weekly cleanup

on:
  push:
    paths:
      - '.github/workflows/mobile-weekly-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unused weekly props
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          weekly = 'src/components/mobile/MobileWeekly.tsx'
          replace_once(weekly,
              "import type { DayEntry, Category, ShortGoal, Routine, RoutineLog, DayMeta, Task, TaskScheduleInput } from '@/types'",
              "import type { DayEntry, ShortGoal, Task, TaskScheduleInput } from '@/types'")
          replace_once(weekly,
              "  categories: Category[]\n  goals: ShortGoal[]\n  routines: Routine[]\n  logs: RoutineLog[]\n",
              "  goals: ShortGoal[]\n")
          replace_once(weekly,
              "  onDeleteTask: (date: string, taskId: string) => void\n  onMetaChange: (date: string, patch: Partial<DayMeta>) => void\n  onToggleRoutine: (routineId: string, date: string) => void\n  onToggleLinkedTask: (goalId: string, taskId: string) => void\n  onLinkGoalTask: (date: string, taskId: string) => void\n  onUnlinkGoalTask: (date: string, taskId: string) => void\n",
              "  onDeleteTask: (date: string, taskId: string) => void\n")
          replace_once(weekly,
              "  selectedDate, days, categories, goals, routines, logs,\n  onSelectDate, getDay, onToggleTask, onAddTask, onUpdateTask, onDeleteTask,\n  onMetaChange, onToggleRoutine, onToggleLinkedTask, onLinkGoalTask, onUnlinkGoalTask,\n  onAddGoal,\n",
              "  selectedDate, days, goals,\n  onSelectDate, getDay, onToggleTask, onAddTask, onUpdateTask, onDeleteTask,\n  onAddGoal,\n")

          layout = 'src/components/mobile/MobileLayout.tsx'
          replace_once(layout,
              "            categories={categories}\n            goals={goals}\n            routines={routines}\n            logs={logs}\n",
              "            goals={goals}\n")
          replace_once(layout,
              "            onDeleteTask={deleteTask}\n            onMetaChange={updateMeta}\n            onToggleRoutine={toggleRoutineLog}\n            onToggleLinkedTask={toggleGoalTask}\n            onLinkGoalTask={linkGoalTask}\n            onUnlinkGoalTask={unlinkGoalTask}\n",
              "            onDeleteTask={deleteTask}\n")
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/mobile-weekly-cleanup-once.yml
          git config user.name "Planr Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: decouple mobile weekly view from routines"
          git push origin HEAD:main
