name: Apply cross-midnight focus timeline patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cross-midnight-focus.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/cross_midnight_patch.py
      - name: Commit patch
        run: |
          git config user.name "Planr Timeline Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/today/TodayDashboard.tsx
          git commit -m "fix: show focus sessions across midnight"
          git push
