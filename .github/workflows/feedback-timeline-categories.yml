name: Apply planner feedback and timeline improvements
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feedback-timeline-categories.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/feedback_timeline_categories_patch.py
      - name: Commit changes
        run: |
          git config user.name "Planr Improvement Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts src/hooks/usePlanrStore.ts src/components/today/TimelineOverlapLayout.tsx src/components/today/TodayDashboard.tsx src/components/today/TaskExecutionLayer.tsx src/app/page.tsx src/lib/aiExport.ts src/components/settings/DataPanel.tsx
          git commit -m "feat: improve timeline planning and GPT feedback export"
          git push
